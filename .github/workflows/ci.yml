name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    container:
      image: php:5.6-apache
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP files
        run: |
          set -e
          for file in $(find . -name "*.php" -not -path "./vendor/*"); do
            php -l "$file"
          done
