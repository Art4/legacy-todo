name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 7.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.2
      - name: Lint PHP files
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l
