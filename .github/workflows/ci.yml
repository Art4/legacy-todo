name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP lint (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["5.6", "7.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Lint PHP files (php ${{ matrix.php-version }} via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:${{ matrix.php-version }}-apache bash -c '
            set -e
            find . -name "*.php" -not -path "./vendor/*" -not -path "./tests/*" -print0 | xargs -0 -n1 php -l
          '

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHPStan analyse (php 8.3 via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq unzip git > /dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer require --dev phpstan/phpstan --no-interaction --no-progress
            vendor/bin/phpstan analyse
          '

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rector process dry-run (php 8.3 via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq unzip git > /dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer install --no-interaction --no-progress
            vendor/bin/rector process --dry-run --no-progress-bar
          '

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHPUnit tests (php 8.3 via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq unzip git > /dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer install --no-interaction --no-progress
            vendor/bin/phpunit
          '
