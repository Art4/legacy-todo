name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHPStan analyse (php 8.3 via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq unzip git > /dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer install --no-interaction --no-progress
            vendor/bin/phpstan analyse
          '

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rector process dry-run (php 8.3 via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq unzip git > /dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer install --no-interaction --no-progress
            vendor/bin/rector process --dry-run --no-progress-bar
          '

  psalm:
    name: Psalm taint analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Psalm taint analysis (php 8.3 via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq unzip git > /dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer install --no-interaction --no-progress
            vendor/bin/psalm --taint-analysis --no-progress
          '

  phpmd:
    name: PHPMD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHPMD (php 8.3 via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq unzip git > /dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer install --no-interaction --no-progress
            vendor/bin/phpmd src,public text phpmd.xml.dist
          '

  phpunit:
    name: PHPUnit (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["7.4", "8.2"]
    steps:
      - uses: actions/checkout@v4

      - name: PHPUnit tests (php ${{ matrix.php-version }} via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:${{ matrix.php-version }}-cli bash -c '
            set -e
            if [ "${{ matrix.php-version }}" = "7.4" ]; then
              echo "deb http://deb.debian.org/debian bullseye main" > /etc/apt/sources.list
              rm -f /etc/apt/sources.list.d/*.list 2>/dev/null || true
              if ! apt-get update -qq; then
                echo "deb http://archive.debian.org/debian bullseye main" > /etc/apt/sources.list
                apt-get update -qq -o Acquire::Check-Valid-Until=false
              fi
            else
              apt-get update -qq
            fi
            apt-get install -y -qq unzip git > /dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            if [ "${{ matrix.php-version }}" = "7.4" ]; then
              composer config platform.php 7.4.33
              composer remove --dev vimeo/psalm --no-update
              composer require --dev phpunit/phpunit:^9 --no-update
              composer update --prefer-stable --no-interaction --no-progress --no-audit
              vendor/bin/phpunit -c phpunit-9.xml.dist --testsuite Unit,Legacy --no-coverage
            else
              composer install --no-interaction --no-progress
              vendor/bin/phpunit --testsuite Unit,Legacy --no-coverage
            fi
          '

  e2e:
    name: E2E (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["7.4", "8.2"]
    steps:
      - uses: actions/checkout@v4

      - name: End-to-end tests (php ${{ matrix.php-version }} via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:${{ matrix.php-version }}-cli bash -c '
            set -e
            if [ "${{ matrix.php-version }}" = "7.4" ]; then
              echo "deb http://deb.debian.org/debian bullseye main" > /etc/apt/sources.list
              rm -f /etc/apt/sources.list.d/*.list 2>/dev/null || true
              if ! apt-get update -qq; then
                echo "deb http://archive.debian.org/debian bullseye main" > /etc/apt/sources.list
                apt-get update -qq -o Acquire::Check-Valid-Until=false
              fi
            else
              apt-get update -qq
            fi
            apt-get install -y -qq unzip git > /dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            if [ "${{ matrix.php-version }}" = "7.4" ]; then
              composer config platform.php 7.4.33
              composer remove --dev vimeo/psalm --no-update
              composer require --dev phpunit/phpunit:^9 --no-update
              composer update --prefer-stable --no-interaction --no-progress --no-audit
              vendor/bin/phpunit -c phpunit-9.xml.dist --testsuite Functional --no-coverage
            else
              composer install --no-interaction --no-progress
              vendor/bin/phpunit --testsuite Functional --no-coverage
            fi
          '

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Composer audit (php 8.3 via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq unzip git > /dev/null
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer install --no-interaction --no-progress
            composer audit --no-interaction
          '

  coverage:
    name: Test coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHPUnit with coverage and floor check (php 8.3 via Docker)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq unzip git g++ autoconf make > /dev/null
            pecl install pcov > /dev/null 2>&1
            echo "extension=pcov.so" > /usr/local/etc/php/conf.d/docker-php-ext-pcov.ini
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer install --no-interaction --no-progress
            mkdir -p build/logs
            vendor/bin/phpunit --testsuite Unit,Legacy --coverage-clover build/logs/clover.xml
            php scripts/check-coverage-floor.php build/logs/clover.xml .coverage-floor
          '

  semgrep:
    name: Semgrep OWASP Top 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep OWASP Top 10 scan (via Docker)
        run: |
          docker run --rm -v "$PWD":/src -w /src semgrep/semgrep:1.175.1 bash -c '
            set -e
            MB=$(git merge-base HEAD origin/main)
            semgrep --config p/owasp-top-ten --baseline-commit "$MB" --error src/ public/
          '

  secret-detection:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret detection (gitleaks via Docker)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.30.1 detect --source /repo --no-banner
